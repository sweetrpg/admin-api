definitions:
  models.AppCardStatus:
    properties:
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      label:
        type: string
      scope_type:
        $ref: '#/definitions/models.AppCardStatusScopeType'
      scope_value:
        type: string
      updated_at:
        type: string
    type: object
  models.AppCardStatusScopeType:
    enum:
    - service
    type: string
    x-enum-varnames:
    - AppCardStatusScopeService
  models.BannerMessage:
    properties:
      created_at:
        type: string
      created_by:
        description: Platform audit fields (PADR-0001); hard-delete record (PADR-0027),
          no deleted_* pair.
        type: string
      expires_at:
        type: string
      id:
        type: string
      message:
        type: string
      scope_type:
        $ref: '#/definitions/models.ScopeType'
      scope_value:
        type: string
      severity:
        $ref: '#/definitions/models.Severity'
      starts_at:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  models.MaintenanceMode:
    properties:
      created_at:
        type: string
      created_by:
        description: Platform audit fields (PADR-0001); hard-delete record (PADR-0027),
          no deleted_* pair.
        type: string
      description:
        type: string
      enabled:
        type: boolean
      ends_at:
        type: string
      id:
        type: string
      label:
        type: string
      scope_type:
        $ref: '#/definitions/models.MaintenanceScopeType'
      scope_value:
        type: string
      starts_at:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  models.MaintenanceScopeType:
    enum:
    - platform
    - service
    type: string
    x-enum-varnames:
    - MaintenanceScopePlatform
    - MaintenanceScopeService
  models.ScopeType:
    enum:
    - platform
    - service
    - page
    type: string
    x-enum-varnames:
    - ScopePlatform
    - ScopeService
    - ScopePage
  models.Severity:
    enum:
    - info
    - warning
    - critical
    type: string
    x-enum-varnames:
    - SeverityInfo
    - SeverityWarning
    - SeverityCritical
  server.appCardStatusRequest:
    properties:
      enabled:
        type: boolean
      label:
        type: string
      scope_value:
        type: string
    required:
    - label
    - scope_value
    type: object
  server.createBannerRequest:
    properties:
      expires_at:
        type: string
      message:
        type: string
      scope_type:
        $ref: '#/definitions/models.ScopeType'
      scope_value:
        type: string
      severity:
        $ref: '#/definitions/models.Severity'
      starts_at:
        type: string
    required:
    - expires_at
    - message
    - scope_type
    - severity
    type: object
  server.maintenanceModeRequest:
    properties:
      description:
        type: string
      enabled:
        type: boolean
      ends_at:
        type: string
      label:
        type: string
      scope_type:
        $ref: '#/definitions/models.MaintenanceScopeType'
      scope_value:
        type: string
      starts_at:
        type: string
    required:
    - description
    - label
    - scope_type
    - starts_at
    type: object
  server.updateBannerRequest:
    properties:
      expires_at:
        type: string
      message:
        type: string
      scope_type:
        $ref: '#/definitions/models.ScopeType'
      scope_value:
        type: string
      severity:
        $ref: '#/definitions/models.Severity'
      starts_at:
        type: string
    required:
    - expires_at
    - message
    - scope_type
    - severity
    type: object
  vo.ErrorVO:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  vo.HealthResponseVO:
    properties:
      collections:
        items:
          type: string
        type: array
      database:
        type: string
      errors:
        type: integer
      messages:
        items:
          type: string
        type: array
      ping:
        type: string
    type: object
  vo.PingResponseVO:
    properties:
      date:
        type: string
      hostname:
        type: string
    type: object
info:
  contact:
    email: admin@sweetrpg.com
    name: API Support
    url: https://sweetrpg.com
  description: Swagger APIs
  license:
    name: MIT
    url: https://mit-license.org/
  termsOfService: https://pilgrimagesoftware.com/terms/
  title: Admin API service
  version: "1.0"
paths:
  /app-card-statuses:
    get:
      description: Returns every app-card-status record regardless of enabled state,
        for admin-web's management view.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AppCardStatus'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List app-card-status records
      tags:
      - app-card-statuses
    post:
      consumes:
      - application/json
      description: Creates an app-card-status record for the given service scope,
        or updates the existing record for that scope in place if one already exists
        - at most one record per scope is kept. Requires a forwarded user bearer token
        carrying the admin role.
      parameters:
      - description: Bearer user access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: App card status record
        in: body
        name: app_card_status
        required: true
        schema:
          $ref: '#/definitions/server.appCardStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AppCardStatus'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AppCardStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Create or update an app-card-status record
      tags:
      - app-card-statuses
  /app-card-statuses/{id}:
    delete:
      description: Deletes an app-card-status record; it is immediately excluded from
        subsequent queries. Requires a forwarded user bearer token carrying the admin
        role.
      parameters:
      - description: Bearer user access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: App card status record ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Delete an app-card-status record
      tags:
      - app-card-statuses
    put:
      consumes:
      - application/json
      description: Replaces the mutable fields of an existing app-card-status record.
        Requires a forwarded user bearer token carrying the admin role.
      parameters:
      - description: Bearer user access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: App card status record ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated app card status record
        in: body
        name: app_card_status
        required: true
        schema:
          $ref: '#/definitions/server.appCardStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AppCardStatus'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Update an app-card-status record
      tags:
      - app-card-statuses
  /app-card-statuses/active:
    get:
      description: Returns enabled app-card-status records matching any of the requested
        service scopes. scope values look like "service:catalog".
      parameters:
      - collectionFormat: csv
        description: Repeated scope filter, e.g. scope=service:catalog&scope=service:shelf
        in: query
        items:
          type: string
        name: scope
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AppCardStatus'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List active app-card-status records for a set of service scopes
      tags:
      - app-card-statuses
  /banners:
    get:
      description: Default mode returns active (started, not expired) banners matching
        any of the requested scopes, most-severe-first; platform-scoped banners are
        always included. scope values look like "platform", "service:catalog", or
        "page:/catalog/browse". Pass include_inactive=true (admin-web's management
        view) to instead return every banner regardless of scope or expiration - scope
        params are ignored in that mode.
      parameters:
      - collectionFormat: csv
        description: Repeated scope filter, e.g. scope=platform&scope=service:catalog
          - required unless include_inactive=true
        in: query
        items:
          type: string
        name: scope
        type: array
      - description: Return every banner (any scope, expired or scheduled included)
          for admin management views
        in: query
        name: include_inactive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.BannerMessage'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List banners
      tags:
      - banners
    post:
      consumes:
      - application/json
      description: Creates a new admin banner message. expires_at is required; a banner
        without one is rejected. Requires a forwarded user bearer token carrying the
        admin role.
      parameters:
      - description: Bearer user access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Banner message
        in: body
        name: banner
        required: true
        schema:
          $ref: '#/definitions/server.createBannerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.BannerMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Create a banner message
      tags:
      - banners
  /banners/{id}:
    delete:
      description: Deletes a banner message; it is immediately excluded from subsequent
        queries. Requires a forwarded user bearer token carrying the admin role.
      parameters:
      - description: Bearer user access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Banner ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Delete a banner message
      tags:
      - banners
    put:
      consumes:
      - application/json
      description: Replaces the mutable fields of an existing banner message. expires_at
        is required. Requires a forwarded user bearer token carrying the admin role.
      parameters:
      - description: Bearer user access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Banner ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated banner message
        in: body
        name: banner
        required: true
        schema:
          $ref: '#/definitions/server.updateBannerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BannerMessage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Update a banner message
      tags:
      - banners
  /maintenance-modes:
    get:
      description: Returns every maintenance-mode record (platform and every known
        service scope) regardless of enabled state, for admin-web's management view.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MaintenanceMode'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List maintenance-mode records
      tags:
      - maintenance-modes
    post:
      consumes:
      - application/json
      description: Creates a maintenance-mode record for the given scope, or updates
        the existing record for that scope in place if one already exists - at most
        one record per scope is kept. Requires a forwarded user bearer token carrying
        the admin role.
      parameters:
      - description: Bearer user access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Maintenance-mode record
        in: body
        name: maintenance_mode
        required: true
        schema:
          $ref: '#/definitions/server.maintenanceModeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MaintenanceMode'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.MaintenanceMode'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Create or update a maintenance-mode record
      tags:
      - maintenance-modes
  /maintenance-modes/{id}:
    delete:
      description: Deletes a maintenance-mode record; it is immediately excluded from
        subsequent queries. Requires a forwarded user bearer token carrying the admin
        role.
      parameters:
      - description: Bearer user access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Maintenance-mode record ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
          schema: {}
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Delete a maintenance-mode record
      tags:
      - maintenance-modes
    put:
      consumes:
      - application/json
      description: Replaces the mutable fields of an existing maintenance-mode record.
        Requires a forwarded user bearer token carrying the admin role.
      parameters:
      - description: Bearer user access token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Maintenance-mode record ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated maintenance-mode record
        in: body
        name: maintenance_mode
        required: true
        schema:
          $ref: '#/definitions/server.maintenanceModeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MaintenanceMode'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: Update a maintenance-mode record
      tags:
      - maintenance-modes
  /maintenance-modes/active:
    get:
      description: Returns enabled maintenance-mode records matching any of the requested
        scopes; platform-scoped records are always included. scope values look like
        "platform" or "service:catalog".
      parameters:
      - collectionFormat: csv
        description: Repeated scope filter, e.g. scope=platform&scope=service:catalog
        in: query
        items:
          type: string
        name: scope
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MaintenanceMode'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/vo.ErrorVO'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/vo.ErrorVO'
      summary: List active maintenance-mode records for a set of scopes
      tags:
      - maintenance-modes
  /status/health:
    get:
      description: Health check
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vo.HealthResponseVO'
      summary: Health check
      tags:
      - status
  /status/ping:
    get:
      description: Ping
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/vo.PingResponseVO'
      summary: Ping
      tags:
      - status
swagger: "2.0"
