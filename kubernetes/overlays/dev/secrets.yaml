---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-api-db

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-db
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/admin/api/db

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/admin/api/misc
        - sourceRef:
            generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: "admin-api-health-token"
          rewrite:
            - regexp:
                source: "(.*)"
                target: HEALTH_TOKEN

---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password

metadata:
  name: admin-api-health-token

spec:
  length: 53
  digits: 5
  symbols: 5
  symbolCharacters: "-_$@"
  noUpper: false
  allowRepeat: true
