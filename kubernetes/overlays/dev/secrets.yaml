---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-api-db

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-db
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/admin/api/db

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/admin/api/misc
        - sourceRef:
            generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: "admin-api-health-token"
          rewrite:
            - regexp:
                source: "(.*)"
                target: HEALTH_TOKEN
        # Must be the exact same value as admin-web's ADMIN_API_INTERNAL_SERVICE_TOKEN (see
        # sweetrpg/admin-web's kubernetes/overlays/dev/secrets.yaml and this repo's
        # server/middleware/writeauth.go) - rewrite maps the Akeyless key admin-web reads as
        # ADMIN_API_INTERNAL_SERVICE_TOKEN onto the env var name this app reads,
        # INTERNAL_SERVICE_TOKEN, so both sides pull from one shared secret value instead of two
        # that could drift apart. Same pattern as users-api's own secrets.yaml.
        - extract:
              key: /sweetrpg/admin/web/admin-api
          rewrite:
              - regexp:
                    source: "ADMIN_API_INTERNAL_SERVICE_TOKEN"
                    target: "INTERNAL_SERVICE_TOKEN"

---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password

metadata:
  name: admin-api-health-token

spec:
  length: 53
  digits: 5
  symbols: 5
  symbolCharacters: "-_$@"
  noUpper: false
  allowRepeat: true
