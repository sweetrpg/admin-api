---
# Local dev only - points at the shared, no-auth MongoDB in sweetrpg-db
# (sweetrpg/common-infrastructure's database module) instead of the real Atlas cluster dev/prod
# use (see that ExternalSecret in kubernetes/overlays/dev/secrets.yaml). This cluster's network
# can't reliably reach Atlas - confirmed via TCP-level testing while debugging this service's
# failing readiness probe.
apiVersion: v1
kind: Secret

metadata:
    name: api-db

type: Opaque
stringData:
    DB_URI: mongodb://mongodb.sweetrpg-db.svc.cluster.local:27017/sweetrpg-admin

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
    name: admin-api-misc

spec:
    refreshInterval: 1h
    secretStoreRef:
        name: akeyless
        kind: ClusterSecretStore
    target:
        name: api-misc
        creationPolicy: Owner
    dataFrom:
        - extract:
              key: /sweetrpg/admin/api/misc
        - sourceRef:
            generatorRef:
                apiVersion: generators.external-secrets.io/v1alpha1
                kind: Password
                name: "admin-api-health-token"
          rewrite:
            - regexp:
                source: "(.*)"
                target: HEALTH_TOKEN
        # Same Akeyless path as the dev overlay - see that overlay's comment.
        - extract:
              key: /sweetrpg/admin/web/admin-api
          rewrite:
              - regexp:
                    source: "ADMIN_API_INTERNAL_SERVICE_TOKEN"
                    target: "INTERNAL_SERVICE_TOKEN"

---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password

metadata:
  name: admin-api-health-token

spec:
  length: 53
  digits: 5
  symbols: 5
  symbolCharacters: "-_$@"
  noUpper: false
  allowRepeat: true
