apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sweetrpg-admin

resources:
    - ../../base
    - configmaps.yaml
    - secrets.yaml
    - ingress.yaml
    - middlewares.yaml
    - pod-monitor.yaml

labels:
    - pairs:
          app.kubernetes.io/name: admin-api
          app.kubernetes.io/version: v1
          app.kubernetes.io/component: api
          app.kubernetes.io/part-of: admin
          com.sweetrpg/env: local
      includeSelectors: false
      includeTemplates: true

generatorOptions:
    disableNameSuffixHash: true

images:
    - name: admin-api
      newName: ghcr.io/sweetrpg/admin-api
      newTag: latest
