---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: api-v1

spec:
  # Tailscale Kubernetes operator manages this Ingress: no ExternalDNS entry to make (MagicDNS
  # names it admin-api.<tailnet>.ts.net) and no cert-manager issuer to configure (it provisions a
  # Let's Encrypt cert on first connection). Requires MagicDNS and HTTPS enabled on the tailnet -
  # see https://tailscale.com/docs/kubernetes-operator/reference/limitations.
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: api-v1
      port:
        name: http
  tls:
    - hosts:
        - admin-api
