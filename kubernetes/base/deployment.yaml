---
apiVersion: apps/v1
kind: Deployment

metadata:
    name: api-v1

spec:
    strategy:
        rollingUpdate:
            maxSurge: 1
            maxUnavailable: 1
        type: RollingUpdate
    selector:
        matchLabels:
            app: api
            version: v1
            platform: sweetrpg
            package: admin
            component: api
    template:
        metadata:
            labels:
                platform: sweetrpg
                app: api
                package: admin
                component: api
                version: v1
                release: prometheus
            annotations:
                prometheus.io/scrape: "true"
                prometheus.io/path: '/metrics'
                prometheus.io/port: '8000'
        spec:
            serviceAccountName: api
            enableServiceLinks: false
            imagePullSecrets:
                - name: sweetrpg-registry
            containers:
                - name: app
                  image: admin-api
                  imagePullPolicy: Always
                  envFrom:
                      - configMapRef:
                            name: api-common
                      - configMapRef:
                            name: api-env
                      - secretRef:
                            name: api-db
                      - secretRef:
                            name: api-misc
                  env: []
                  ports:
                      - containerPort: 8000
                        name: http
                  resources:
                      requests:
                          cpu: "20m"
                          memory: "55Mi"
                      limits:
                          cpu: "1.0"
                          memory: "1Gi"
                  livenessProbe:
                        httpGet:
                            path: /status/ping
                            port: http
                        initialDelaySeconds: 90
                        timeoutSeconds: 10
                        interval: 10
                  readinessProbe:
                        httpGet:
                            path: /status/health
                            port: http
                            httpHeaders:
                            - name: Authorization
                              value: $(HEALTH_TOKEN)
                        initialDelaySeconds: 30
                        timeoutSeconds: 10
            restartPolicy: Always
